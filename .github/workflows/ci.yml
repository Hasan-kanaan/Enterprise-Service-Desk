name: CI
on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm lint
        working-directory: client
      - run: pnpm build
        working-directory: client
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: service_desk_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d service_desk_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci-isolated-only@localhost:5432/service_desk_ci_test
      TEST_DATABASE_URL: postgresql://ci:ci-isolated-only@localhost:5432/service_desk_ci_test
      STORAGE_PROVIDER: local
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate --config prisma7.config.ts
      - run: pnpm exec prisma generate --config prisma7.config.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test --runInBand
      - run: pnpm test:dependencies
      - run: pnpm exec prisma migrate deploy --config prisma7.config.ts
      - run: pnpm exec prisma migrate status --config prisma7.config.ts
      - run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code --config prisma7.config.ts
      - run: pnpm test:e2e --runInBand
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      # High/critical runtime advisories gate CI. Lower/dev findings stay visible.
      - run: pnpm audit --prod --audit-level high
        working-directory: ${{ matrix.app }}
      - run: pnpm audit --audit-level low
        if: always()
        working-directory: ${{ matrix.app }}
        continue-on-error: true
